name: publish to ghcr

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Dockerfile"
      - "Dockerfile.aarch64"
      - ".github/workflows/docker-publish.yml"
      - "root/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Resolve image version
        id: fetch_version
        run: |
          # When the build was triggered by a sync-upstream run it persisted the
          # FAH release version in vars.FAH_VERSION. Prefer that so the tag
          # matches the version that was actually merged; fall back to live
          # lookup otherwise (manual dispatch, push to master, etc.).
          if [ -n "${FAH_VERSION:-}" ]; then
            VERSION="${FAH_VERSION}"
          else
            VERSION=$(curl -s https://download.foldingathome.org/releases/public/fah-client/meta.json \
              | jq -r '.[] | select((.package | contains("amd64.deb")) and (.package | contains("release"))) | .package' \
              | awk -F'(fah-client_|_amd64.deb)' '{print $2}' \
              | sort -rV | head -1)
          fi
          echo "Resolved version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        env:
          FAH_VERSION: ${{ vars.FAH_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/dablincx/foldingathome
          tags: |
            type=sha,prefix=sha-
            type=raw,value=${{ steps.fetch_version.outputs.version }}
            type=raw,value=${{ steps.fetch_version.outputs.version }}-${{ github.run_number }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FOLDINGATHOME_RELEASE=${{ steps.fetch_version.outputs.version }}
